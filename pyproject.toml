[project]
name = "akari-yolo-inference"
version = "0.1.0"
description = "AKARIでYOLOの推論を行うパッケージ"
requires-python = ">=3.10"
dependencies = [
    "akari-client[depthai]",
    "akari-proto",
    "ndjson",
    "ruff>=0.15.9",
    "tqdm",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
